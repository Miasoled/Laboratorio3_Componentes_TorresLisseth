services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: componentes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../U3_BackendExpress/database/script.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d componentes"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../../U3_BackendExpress
    environment:
      PUERTO: 3000
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: componentes
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: cambiar-en-produccion
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "4173:4173"
    depends_on:
      - backend

volumes:
  postgres_data:
